<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NeuroExplora AR</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Press Start 2P',monospace}

#video-bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;display:block}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:auto}

/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#top{padding:14px 16px;background:linear-gradient(to bottom,rgba(5,5,8,.85),transparent);display:flex;justify-content:space-between;align-items:flex-start}
#logo p:first-child{font-size:9px;color:#e56c78;letter-spacing:.2em;opacity:.85}
#logo p:last-child{font-size:13px;color:#fff;letter-spacing:.1em;margin-top:3px}
#back-btn{pointer-events:auto;padding:9px 14px;background:rgba(5,5,8,.9);border:1px solid rgba(229,108,120,.5);color:#e56c78;font-size:9px;cursor:pointer}
#bottom{padding:14px 16px 24px;background:linear-gradient(to top,rgba(5,5,8,.75),transparent);text-align:center}
#msg{font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.08em;line-height:1.8}
#msg.found{color:#50e3b0}

/* Marco de escaneo */
#frame{position:fixed;top:50%;left:50%;transform:translate(-50%,-58%);width:200px;height:200px;pointer-events:none;z-index:9;transition:opacity .5s}
.co{position:absolute;width:22px;height:22px}
.tl{top:0;left:0;border-top:2px solid #e56c78;border-left:2px solid #e56c78}
.tr{top:0;right:0;border-top:2px solid #e56c78;border-right:2px solid #e56c78}
.bl{bottom:0;left:0;border-bottom:2px solid #e56c78;border-left:2px solid #e56c78}
.br{bottom:0;right:0;border-bottom:2px solid #e56c78;border-right:2px solid #e56c78}
.sl{position:absolute;left:4px;right:4px;height:1px;background:linear-gradient(90deg,transparent,#e56c78,transparent);animation:sy 2s ease-in-out infinite}
@keyframes sy{0%{top:4px;opacity:.3}50%{top:188px;opacity:1}100%{top:4px;opacity:.3}}

/* Botón activar */
#scan-btn{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:11;
  padding:14px 28px;background:#e56c78;color:#050508;border:none;cursor:pointer;
  font-size:11px;letter-spacing:.08em;box-shadow:4px 4px 0 rgba(229,108,120,.3)}
#scan-btn.hidden{display:none}

/* Panel info */
#panel{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(5,5,8,.97);
  border-top:1px solid rgba(229,108,120,.4);padding:20px 18px 36px;
  transform:translateY(100%);transition:transform .3s ease}
#panel.open{transform:translateY(0)}
#p-num{font-size:26px;font-weight:700;opacity:.1;color:#fff;line-height:1;margin-bottom:2px;font-family:monospace}
#p-name{font-size:13px;color:#e56c78;letter-spacing:.12em;margin-bottom:10px}
#p-desc{font-size:11px;color:rgba(255,255,255,.65);line-height:1.9;max-height:120px;overflow-y:auto;font-family:monospace}
#p-fact{font-size:10px;color:rgba(229,108,120,.55);margin-top:8px;line-height:1.7;font-family:monospace}
#p-close{position:absolute;top:14px;right:16px;background:transparent;border:none;color:rgba(255,255,255,.35);font-size:22px;cursor:pointer;pointer-events:auto}
</style>
</head>
<body>

<video id="video-bg" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="hud">
  <div id="top">
    <div id="logo">
      <p>// MODO AR</p>
      <p>NEUROEXPLORA</p>
    </div>
    <button id="back-btn" onclick="window.location.href='/'">× SALIR</button>
  </div>
  <div id="bottom">
    <p id="msg">APUNTA AL MARCADOR Y PULSA ACTIVAR</p>
  </div>
</div>

<div id="frame">
  <div class="co tl"></div><div class="co tr"></div>
  <div class="co bl"></div><div class="co br"></div>
  <div class="sl"></div>
</div>

<button id="scan-btn" onclick="activateAR()">▶ &nbsp;ACTIVAR AR</button>

<div id="panel">
  <button id="p-close" onclick="closePanel()">×</button>
  <div id="p-num">01</div>
  <div id="p-name"></div>
  <div id="p-desc"></div>
  <div id="p-fact"></div>
</div>

<script>
const REGIONS=[
  {name:'Lóbulo Frontal',   color:0x4d88ff, pos:[0.62,0.12,0.32],  shape:[0.82,0.60,0.75,0.08],
   desc:'Centro del razonamiento complejo, la planificación y la toma de decisiones. Alberga la corteza motora primaria que controla los movimientos voluntarios.',
   fn:'Representa el 41% del neocórtex humano y es la región que más ha crecido durante la evolución.'},
  {name:'Lóbulo Parietal',  color:0x44dd88, pos:[0,0.55,0],         shape:[0.65,0.50,0.55,0.07],
   desc:'Procesa la información sensorial del cuerpo: tacto, temperatura, dolor y presión. Integra señales para orientar el cuerpo en el espacio.',
   fn:'Contiene el homúnculo de Penfield: un mapa donde la mano ocupa más espacio que el tronco.'},
  {name:'Lóbulo Temporal',  color:0xbb55ff, pos:[-0.65,0,-0.1],     shape:[0.55,0.45,0.60,0.06],
   desc:'Esencial para la audición, la comprensión del lenguaje hablado y la formación de nuevas memorias. Contiene el hipocampo.',
   fn:'El área de Wernicke, aquí ubicada, permite comprender el lenguaje hablado.'},
  {name:'Lóbulo Occipital', color:0xffcc33, pos:[0,-0.08,-0.68],    shape:[0.45,0.40,0.52,0.06],
   desc:'Principal centro de procesamiento visual del cerebro. Interpreta formas, colores, movimiento y profundidad enviados por la retina.',
   fn:'Una lesión aquí puede causar ceguera cortical aunque los ojos funcionen perfectamente.'},
  {name:'Cerebelo',         color:0xff7733, pos:[0,-0.52,-0.38],     shape:[0.72,0.58,0.65,0.08],
   desc:'Coordina los movimientos voluntarios y mantiene el equilibrio. Permite automatizar habilidades como caminar o escribir.',
   fn:'Aunque es el 10% del volumen, contiene más del 50% de todas las neuronas del cerebro.'},
  {name:'Tronco Encefálico',color:0xff4477, pos:[0,-0.32,0.12],      shape:[0.38,0.55,0.38,0.07],
   desc:'Conecta el cerebro con la médula espinal y controla funciones vitales: respiración, ritmo cardíaco y presión arterial.',
   fn:'Es la estructura evolutivamente más antigua del cerebro, presente desde hace más de 500 millones de años.'},
];

// ── Three.js setup ────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 0, 3);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 1.1); dl.position.set(2,3,4); scene.add(dl);
const dl2= new THREE.DirectionalLight(0x8899ff, 0.3); dl2.position.set(-2,-1,-2); scene.add(dl2);
const pt = new THREE.PointLight(0xffffff, 0.6, 20); scene.add(pt);

function onResize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ── Geometría cerebro ────────────────────────────────
function mkSphere(rx,ry,rz,na){
  const g=new THREE.SphereBufferGeometry(1,26,18);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const n=(Math.sin(x*4.7+y*3.1)*Math.cos(y*2.3-z*3.7)+Math.sin(z*5.1))*na;
    p.setXYZ(i,x*rx+n,y*ry+n,z*rz+n);
  }
  p.needsUpdate=true; g.computeVertexNormals(); return g;
}

const brainGroup = new THREE.Group();
brainGroup.visible = false;
scene.add(brainGroup);

const meshes = [];
REGIONS.forEach((r,i)=>{
  const [rx,ry,rz,na]=r.shape;
  const mat=new THREE.MeshPhongMaterial({color:r.color,transparent:true,opacity:0.9,shininess:50});
  const m=new THREE.Mesh(mkSphere(rx,ry,rz,na),mat);
  m.position.set(...r.pos); m.userData.ri=i;
  brainGroup.add(m); meshes.push(m);
});
const wv=[]; meshes.forEach(m=>{const p=m.geometry.attributes.position;for(let i=0;i<p.count;i++)wv.push(p.getX(i)+m.position.x,p.getY(i)+m.position.y,p.getZ(i)+m.position.z);});
const wg=new THREE.BufferGeometry(); wg.setAttribute('position',new THREE.Float32BufferAttribute(wv,3));
brainGroup.add(new THREE.Mesh(wg,new THREE.MeshBasicMaterial({color:0xff44aa,wireframe:true,transparent:true,opacity:0.06})));
brainGroup.scale.setScalar(0.55);

// ── Cámara trasera ────────────────────────────────────
async function startCamera(){
  const video = document.getElementById('video-bg');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = stream;
    await video.play();
  } catch(e){
    // Si falla cámara trasera, intentar cualquier cámara
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video:true });
      document.getElementById('video-bg').srcObject = stream;
      await document.getElementById('video-bg').play();
    } catch(e2){
      document.getElementById('msg').textContent = 'SIN ACCESO A CÁMARA';
    }
  }
}
startCamera();

// ── Device orientation → cerebro world-locked ────────
let hasOrient = false;
let orientEuler = new THREE.Euler(0,0,0,'YXZ');
let targetQuat = new THREE.Quaternion();
let currentQuat = new THREE.Quaternion();

function applyOrientation(alpha, beta, gamma){
  const toRad = Math.PI/180;
  // Corrección de ejes para pantalla portrait
  const rot = new THREE.Euler(
    beta  * toRad,
    alpha * toRad,
    -gamma * toRad,
    'YXZ'
  );
  targetQuat.setFromEuler(rot);
  hasOrient = true;
}

function requestOrientPermission(){
  if(typeof DeviceOrientationEvent !== 'undefined' &&
     typeof DeviceOrientationEvent.requestPermission === 'function'){
    // iOS 13+
    DeviceOrientationEvent.requestPermission()
      .then(r=>{ if(r==='granted') listenOrientation(); })
      .catch(()=>{});
  } else {
    listenOrientation();
  }
}

function listenOrientation(){
  window.addEventListener('deviceorientation', e=>{
    if(e.alpha!=null) applyOrientation(e.alpha, e.beta||0, e.gamma||0);
  }, true);
}

// ── Activar AR ────────────────────────────────────────
let arActive = false;
let scanProgress = 0;
let scanInterval = null;

function activateAR(){
  if(arActive) return;
  requestOrientPermission();

  const btn = document.getElementById('scan-btn');
  btn.disabled = true;
  btn.textContent = 'ESCANEANDO...';

  // Animación de escaneo ~2s
  scanProgress = 0;
  scanInterval = setInterval(()=>{
    scanProgress++;
    if(scanProgress >= 8){
      clearInterval(scanInterval);
      arActive = true;
      brainGroup.visible = true;
      btn.classList.add('hidden');
      document.getElementById('frame').style.opacity='0';
      const msg = document.getElementById('msg');
      msg.textContent='CEREBRO ANCLADO · MUÉVETE PARA EXPLORAR';
      msg.className='found';
    }
  }, 250);
}

// ── Tap en regiones ───────────────────────────────────
canvas.addEventListener('click', e=>{
  if(!arActive) return;
  if(document.getElementById('panel').classList.contains('open')) return;

  const nx=(e.clientX/innerWidth)*2-1;
  const ny=-(e.clientY/innerHeight)*2+1;
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(nx,ny), camera);
  const hits = ray.intersectObjects(meshes, false);
  if(hits.length>0 && hits[0].object.userData.ri!==undefined) openPanel(hits[0].object.userData.ri);
});

// ── Render loop ───────────────────────────────────────
let t = 0;
renderer.setAnimationLoop(()=>{
  t += 0.016;
  pt.position.set(Math.sin(t*0.5)*3, 2, Math.cos(t*0.4)*3);

  if(arActive && hasOrient){
    // Interpolación suave hacia orientación del dispositivo
    currentQuat.slerp(targetQuat, 0.08);
    brainGroup.quaternion.copy(currentQuat);
  } else if(arActive){
    // Sin giroscopio: rotación lenta automática
    brainGroup.rotation.y += 0.007;
  }

  renderer.render(scene, camera);
});

// ── Info panel ────────────────────────────────────────
function openPanel(i){
  const r=REGIONS[i];
  document.getElementById('p-num').textContent=String(i+1).padStart(2,'0');
  document.getElementById('p-name').textContent=r.name;
  document.getElementById('p-desc').textContent=r.desc;
  document.getElementById('p-fact').textContent='★ '+r.fn;
  document.getElementById('panel').classList.add('open');
}
function closePanel(){ document.getElementById('panel').classList.remove('open'); }
</script>
</body>
</html>
